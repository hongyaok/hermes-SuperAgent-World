name: superagent
version: 0.5.0
description: >
  Router/worker coding agent for one repository, plus a chat-first desktop
  workspace. Polls GitHub (or takes local requests), turns accepted work into
  tickets or headless chat turns, and runs each in isolation. Observe by
  default; a panel shows only what needs a human, and nothing is ever
  committed or pushed on your behalf.
author: Hermes
provides_tools:
  - superagent_ask
  - superagent_tick
  - superagent_status
  - superagent_run
  - superagent_spawn
config_schema:
  mode:
    type: str
    choices: [off, observe, auto]
    default: observe
    label: Mode
    description: "off = do nothing; observe = record requests only; auto = launch worker subagents."
  repo_path:
    type: str
    default: ""
    label: Repository path
    description: Local clone the workers should work in.
  github_repo:
    type: str
    default: ""
    label: GitHub repository
    description: "owner/name to poll for @mentions. Leave empty to use local requests only."
  github_agent_login:
    type: str
    default: ""
    label: Agent GitHub login
    description: The account the agent acts as; mentions of it become requests.
  github_allowed_users:
    type: list
    default: []
    label: Allowed GitHub users
    description: Only these logins may request work. Empty means nobody.
  github_token:
    type: secret
    env: SUPERAGENT_GITHUB_TOKEN
    label: GitHub token
    description: Fine-grained token with issues read/write on the repository.
  max_workers:
    type: int
    default: 2
    label: Max parallel workers
    description: How many worker subagents may run at once.
  worker_toolsets:
    type: list
    default: [file, terminal]
    label: Worker toolsets
    description: Toolsets each worker subagent may use.
  allow_proactive:
    type: bool
    default: false
    label: Allow proactive work
    description: Let the agent pick up unaddressed messages that match an action verb.
  max_runtime_seconds:
    type: int
    default: 1800
    label: Worker time limit
    description: A worker still running after this many seconds is cancelled by the watchdog.
  poll_limit:
    type: int
    default: 30
    label: GitHub poll size
    description: Maximum comments fetched per poll.
  default_model:
    type: str
    default: ""
    label: Default chat model
    description: Model used by desktop chat sessions when the request does not pick one. Empty means the CLI default.
  default_provider:
    type: str
    default: ""
    label: Default chat provider
    description: Provider for the default chat model (for example opencode-go). Empty means the CLI default.
  model_presets:
    type: list
    default: []
    label: Model presets
    description: >-
      Named models offered as composer chips. Accepts
      "name=provider:model", plain "model" strings, or {name, model, provider}
      objects; empty means no chips (the model picker still works). At most 12,
      unique names.
  worker_yolo:
    type: bool
    default: true
    label: Workers run unattended
    description: Pass --yolo to headless chat workers so they do not wait for approval prompts.
  chat_max_turns:
    type: int
    default: 120
    label: Chat turn limit
    description: Maximum agent turns for one headless chat worker.
  github_watch_mode:
    type: str
    choices: [observe, auto]
    default: observe
    label: GitHub watch mode
    description: "observe = record PR mentions as sessions only; auto = launch a worker for each one."
  github_watch_new_prs:
    type: bool
    default: false
    label: Watch new PR heads
    description: Start a review session whenever a watched pull request gets a new head commit.
  github_poll_seconds:
    type: int
    default: 90
    label: GitHub poll interval
    description: Seconds between background GitHub polls (minimum 5).
  github_pr_limit:
    type: int
    default: 10
    label: GitHub PR limit
    description: Maximum open pull requests checked per poll (1-100).
  turn_timeout_seconds:
    type: int
    default: 1800
    label: Chat turn time limit
    description: >-
      A queued or running chat turn older than this many seconds is cancelled by the
      next reap or chat-list read (env SUPERAGENT_TURN_TIMEOUT_SECONDS). 0 disables the guard.
